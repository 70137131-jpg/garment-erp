name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migration cycle (upgrade → downgrade → upgrade)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://erp:erp@localhost:5432/erp_test' || '' }}
        run: pytest tests/ -q

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t garment-erp-backend:ci .

      - name: Build frontend image
        run: docker build -t garment-erp-frontend:ci frontend

      - name: Backend image boots and passes /health
        run: |
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_USER=erp -e POSTGRES_PASSWORD=erp -e POSTGRES_DB=erp \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U erp -d erp && break; sleep 2;
          done
          docker run -d --name backend --network ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://erp:erp@db:5432/erp \
            -e AUTO_CREATE_SCHEMA=false \
            garment-erp-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi; sleep 2;
          done
          docker logs backend
          test "$ok" = 1
          curl -fsS http://localhost:8000/ready
