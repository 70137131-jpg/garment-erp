# Serves the built SPA and proxies /api/* to the backend service, mirroring
# the Vite dev proxy (the /api prefix is stripped before forwarding).
server {
    listen 80;
    server_name _;

    # Compress text assets: the app bundle drops from ~330 kB to ~90 kB on
    # the wire. Static gzip is safe; API responses are compressed upstream.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route renders index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }

    client_max_body_size 25m;
}
